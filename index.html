<html lang="en">
<head>

  <link rel="manifest" href="manifest.webmanifest">

  <title>NCTD Train Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #1f2937; }
    header { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: max(10px, env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid #d1d5db; }
    h1 { margin: 0; font-size: 1.2rem; }
    nav { display: flex; gap: 8px; }
    button { min-height: 44px; padding: 8px 14px; border: 1px solid #9ca3af; border-radius: 4px; background: #fff; color: #1f2937; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #1d4ed8; background: #1d4ed8; color: #fff; }
    #map { width: 100%; height: calc(100dvh - 64px); }
    .notice { position: absolute; z-index: 500; right: 12px; bottom: 12px; padding: 8px 10px; border-radius: 4px; background: #fff; box-shadow: 0 1px 4px #777; font-size: .8rem; }
    #install { margin-left: auto; }
    @media (max-width: 480px) { header { flex-wrap: wrap; } h1 { width: 100%; } #install { margin-left: 0; } #map { height: calc(100dvh - 118px); } }
  </style>
</head>
<body>
  <header>
    <h1>NCTD Train Tracker</h1>
    <nav aria-label="Train route">
      <button type="button" data-route="398" aria-pressed="true">COASTER</button>

    </nav>
    <button id="install" type="button" hidden>Install</button>

223],[33.201059,-117.314233],[33.202057,-117.308089],[33.203143,-117.29219],[33.204897,-117.287222],[33.208804,-117.278456],[33.20965,-117.274553],[33.211444,-117.270624],[33.213272,-117.269896],[33.218876,-117.262228],[33.219698,-117.258186],[33.219216,-117.255911],[33.217863,-117.254598],[33.212532,-117.253552],[33.206696,-117.251897],[33.205783,-117.249947],[33.204847,-117.246373],[33.202992,-117.244863],[33.197315,-117.241041],[33.194261,-117.238025],[33.191371,-117.237829],[33.190535,-117.237477],[33.189873,-117.236115],[33.19028,-117.234051],[33.190103,-117.230312],[33.189652,-117.22866],[33.187954,-117.227128],[33.185665,-117.225389],[33.183887,-117.223513],[33.182377,-117.218446],[33.179048,-117.216001],[33.173947,-117.209235],[33.173499,-117.207393],[33.173251,-117.204743],[33.171919,-117.203608],[33.170056,-117.204169],[33.167129,-117.205631],[33.165617,-117.20464],[33.164852,-117.201148],[33.163879,-117.199752],[33.162088,-117.199253],[33.158827,-117.198995],[33.152036,-117.194272],[33.147036,-117.185658],[33.146924,-117.18518],[33.145826,-117.178091],[33.141957,-117.160675],[33.141486,-117.158803],[33.135144,-117.156349],[33.134431,-117.155006],[33.134771,-117.153585],[33.136658,-117.148796],[33.137772,-117.145697],[33.138196,-117.141444],[33.139464,-117.139716],[33.138899,-117.137727],[33.138268,-117.134085],[33.135435,-117.129702],[33.131112,-117.124154],[33.129146,-117.120875],[33.123555,-117.105872],[33.122479,-117.102942],[33.119753,-117.095664],[33.118419,-117.092161]]]}};
    const routeInfo = {
      '398': { color: '#2563eb', name: 'COASTER' },
      '399': { color: '#059669', name: 'SPRINTER' }
    };
    const map = L.map('map', { zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    let layer;

    function directionLabel(routeId, directionId) {
      return routeId === '398' ? (directionId === 0 ? 'Northbound — Oceanside' : 'Southbound — San Diego') : (directionId === 0 ? 'Eastbound — Escondido' : 'Westbound — Oceanside');
    }

    async function loadPredictions(stop, popup) {
      const content = popup.getElement()?.querySelector('.prediction');
      if (!content) return;
      try {
        const response = await fetch(apiUrl(`/api/predictions?stopIds=${encodeURIComponent(stop.ids.join(','))}`));
        if (!response.ok) throw new Error('Prediction feed unavailable');
        const { predictions } = await response.json();
        const nextByDirection = new Map();
        predictions.forEach((prediction) => {
          const key = `${prediction.routeId}-${prediction.directionId}`;
          if (!nextByDirection.has(key)) nextByDirection.set(key, prediction);
        });
        const next = [...nextByDirection.values()].sort((a, b) => a.timestamp - b.timestamp);
        content.innerHTML = next.length ? next.map((prediction) => {
          const minutes = Math.max(0, Math.round((prediction.timestamp - Date.now()) / 60000));
          return `<div><strong>${directionLabel(prediction.routeId, prediction.directionId)}</strong><br>${minutes === 0 ? 'Due now' : `${minutes} min`}</div>`;
        }).join('<hr>') : 'No live arrivals are currently reported for this station.';
      } catch { content.textContent = 'Live arrival times are temporarily unavailable.'; }
    }
    function showRoute(routeId) {
      const route = routes[routeId];
      const info = routeInfo[routeId];
      if (layer) map.removeLayer(layer);
      layer = L.featureGroup().addTo(map);
      route.lines.forEach((line) => L.polyline(line, { color: info.color, weight: 5, opacity: .85 }).addTo(layer));
      route.stops.forEach((stop) => L.circleMarker([stop.lat, stop.lon], {
        radius: 5, color: '#fff', weight: 2, fillColor: info.color, fillOpacity: 1
      }).bindPopup(`<strong>${stop.name}</strong><br><span class="prediction">Loading next trains…</span>`).on('popupopen', (event) => loadPredictions(stop, event.target.getPopup())).addTo(layer));
      map.fitBounds(layer.getBounds(), { padding: [28, 28], maxZoom: 12 });
      document.querySelectorAll('[data-route]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.route === routeId)));
    }

    document.querySelectorAll('[data-route]').forEach((button) => button.addEventListener('click', () => showRoute(button.dataset.route)));
    const trainLayer = L.featureGroup().addTo(map);
    const status = document.getElementById('status');
    const trainIcon = (color, bearing) => L.divIcon({
      className: '',
      html: `<span style="display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;background:${color};border:2px solid white;box-shadow:0 1px 4px #555;transform:rotate(${bearing || 0}deg)"></span>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    async function loadVehicles() {
      try {
        const response = await fetch(apiUrl('/api/vehicles'));
        if (!response.ok) throw new Error('Vehicle feed unavailable');
        const { vehicles, fetchedAt } = await response.json();
        trainLayer.clearLayers();
        const visible = vehicles.filter((vehicle) => vehicle.routeId === document.querySelector('[aria-pressed="true"]').dataset.route);
        visible.forEach((vehicle) => {
          const color = routeInfo[vehicle.routeId].color;
          L.marker([vehicle.latitude, vehicle.longitude], { icon: trainIcon(color, vehicle.bearing) })
            .bindPopup(`<strong>${routeInfo[vehicle.routeId].name}</strong><br>${vehicle.label}<br>${vehicle.speedMph} mph`)
            .addTo(trainLayer);
        });
        status.textContent = `${visible.length} live train${visible.length === 1 ? '' : 's'} · updated ${new Date(fetchedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
      } catch {
        status.textContent = 'Live train positions temporarily unavailable';
      }
    }

    const selectRoute = showRoute;
    showRoute = function(routeId) { selectRoute(routeId); loadVehicles(); };
    setInterval(loadVehicles, 30000);
    let installPrompt;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      installPrompt = event;
      document.getElementById('install').hidden = false;
    });
    document.getElementById('install').addEventListener('click', async () => {
      if (!installPrompt) return;
      await installPrompt.prompt();
      installPrompt = undefined;
      document.getElementById('install').hidden = true;
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    showRoute('398');
  </script>
</body>
</html>
